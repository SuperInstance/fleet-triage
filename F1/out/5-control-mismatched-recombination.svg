<text x="92" y="30" font-size="16" font-weight="600" fill="#111827">CONTROL: recombination correlated with the private signal</text>
<text x="740" y="66" font-size="11" fill="#374151" font-family="monospace">the thesis requires the stochasticity be</text>
<text x="740" y="81" font-size="11" fill="#374151" font-family="monospace">INDEPENDENT of the private data e_i.</text>
<text x="740" y="96" font-size="11" fill="#374151" font-family="monospace"></text>
<text x="740" y="111" font-size="11" fill="#374151" font-family="monospace">if correlated recombination also holds</text>
<text x="740" y="126" font-size="11" fill="#374151" font-family="monospace">the variance, the requirement is weaker</text>
<text x="740" y="141" font-size="11" fill="#374151" font-family="monospace">than claimed.  (here: much worse --</text>
<text x="740" y="156" font-size="11" fill="#374151" font-family="monospace">it is inverted.)</text>
