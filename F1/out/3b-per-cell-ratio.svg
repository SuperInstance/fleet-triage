<text x="411" y="546" font-size="13" text-anchor="middle" fill="#111827">k / D</text>
<text transform="translate(20,275) rotate(-90)" font-size="13" text-anchor="middle" fill="#111827">V_field / N^d  divided by  sigma^2/(2k)</text>
<text x="92" y="30" font-size="16" font-weight="600" fill="#111827">Per-cell variance vs the paper&#x27;s sigma^2/(2k)</text>
<text x="740" y="66" font-size="11" fill="#374151" font-family="monospace">the ONLY normalisation under which the</text>
<text x="740" y="81" font-size="11" fill="#374151" font-family="monospace">paper can be right at all</text>
<text x="740" y="96" font-size="11" fill="#374151" font-family="monospace"></text>
<text x="740" y="111" font-size="11" fill="#374151" font-family="monospace">d=1 N=256</text>
<text x="740" y="126" font-size="11" fill="#374151" font-family="monospace">d=2 N=32</text>
<text x="740" y="141" font-size="11" fill="#374151" font-family="monospace"></text>
<text x="740" y="156" font-size="11" fill="#374151" font-family="monospace">ratio = 1 only for k/D &gt;~ 100,</text>
<text x="740" y="171" font-size="11" fill="#374151" font-family="monospace">i.e. k &gt;&gt; D (L/pi)^2</text>
