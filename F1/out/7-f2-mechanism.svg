<rect x="92" y="52" width="638" height="446" fill="none" stroke="#9ca3af"/>
<text x="411" y="546" font-size="13" text-anchor="middle" fill="#111827">generation</text>
<text transform="translate(20,275) rotate(-90)" font-size="13" text-anchor="middle" fill="#111827">self-averaged variance</text>
<text x="92" y="30" font-size="16" font-weight="600" fill="#111827">F2&#x27;s actual mechanism: diploid Wright-Fisher, random mating</text>
<text x="740" y="66" font-size="11" fill="#374151" font-family="monospace">started MONOMORPHIC; only the operator</text>
<text x="740" y="81" font-size="11" fill="#374151" font-family="monospace">can create diversity</text>
<text x="740" y="96" font-size="11" fill="#374151" font-family="monospace"></text>
<text x="740" y="111" font-size="11" fill="#374151" font-family="monospace">s=0  -&gt; independent stochasticity (what the</text>
<text x="740" y="126" font-size="11" fill="#374151" font-family="monospace">       thesis licenses): diversity dies on a</text>
<text x="740" y="141" font-size="11" fill="#374151" font-family="monospace">       ~N-generation timescale</text>
<text x="740" y="156" font-size="11" fill="#374151" font-family="monospace">s&gt;0  -&gt; state-dependent (heterozygote</text>
<text x="740" y="171" font-size="11" fill="#374151" font-family="monospace">       advantage = F2&#x27;s 1:2:1): diversity held</text>
<text x="740" y="186" font-size="11" fill="#374151" font-family="monospace"></text>
<text x="740" y="201" font-size="11" fill="#374151" font-family="monospace">max possible = 0.25,  HW 1:2:1 = 0.125</text>
