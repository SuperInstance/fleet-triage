<text x="411" y="546" font-size="13" text-anchor="middle" fill="#111827">k</text>
<text transform="translate(20,275) rotate(-90)" font-size="13" text-anchor="middle" fill="#111827">per-cell stationary variance</text>
<text x="92" y="30" font-size="16" font-weight="600" fill="#111827">Ablation: is any term in the paper&#x27;s equation doing nothing?</text>
<text x="740" y="66" font-size="11" fill="#374151" font-family="monospace">paper: sigma^2/(2k), a straight line</text>
<text x="740" y="81" font-size="11" fill="#374151" font-family="monospace">with slope -1 and no D anywhere</text>
<text x="740" y="96" font-size="11" fill="#374151" font-family="monospace"></text>
<text x="740" y="111" font-size="11" fill="#374151" font-family="monospace">D=0 : exactly the paper&#x27;s answer</text>
<text x="740" y="126" font-size="11" fill="#374151" font-family="monospace">D=1 : the diffusion term changes it by</text>
<text x="740" y="141" font-size="11" fill="#374151" font-family="monospace">       up to 3x and bends the slope</text>
<text x="740" y="156" font-size="11" fill="#374151" font-family="monospace">k=0 : NO stationary state at all --</text>
<text x="740" y="171" font-size="11" fill="#374151" font-family="monospace">       V grows as sigma^2 t without bound,</text>
<text x="740" y="186" font-size="11" fill="#374151" font-family="monospace">       which is delocalisation, not &#x27;one blob&#x27;</text>
