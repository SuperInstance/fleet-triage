<text x="92" y="30" font-size="16" font-weight="600" fill="#111827">Federation dynamics: two different &#x27;variances&#x27;</text>
<text x="740" y="66" font-size="11" fill="#374151" font-family="monospace">SOLID  = spread about the ensemble mean</text>
<text x="740" y="81" font-size="11" fill="#374151" font-family="monospace">DASHED = self-averaged: each population&#x27;s</text>
<text x="740" y="96" font-size="11" fill="#374151" font-family="monospace">         variance about its OWN mean</text>
<text x="740" y="111" font-size="11" fill="#374151" font-family="monospace"></text>
<text x="740" y="126" font-size="11" fill="#374151" font-family="monospace">the second is what a participant sees,</text>
<text x="740" y="141" font-size="11" fill="#374151" font-family="monospace">and the one that matters for a federation</text>
